name: GitHub Pages 자동 배포

on:
  push:
    branches: [index]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 배포 파일 준비
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 배포 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
